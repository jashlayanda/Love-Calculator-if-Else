
<!DOCTYPE html>
<html>
<head>
    <title>Love Calculator - Exercise 2</title>
</head>
<body>

    <h1>Love Calculator ❤️</h1>

    <script>
        var name1 = prompt("What is your name?");
        var name2 = prompt("What is their name?");

        var loveScore = Math.floor(Math.random() * 100) + 1;

        if (loveScore > 70) {
            alert(name1 + " and " + name2 + "'s love score is " + loveScore + "%. You love each other!");
        } else if (loveScore > 30 && loveScore <= 70) {
            alert(name1 + " and " + name2 + "'s love score is " + loveScore + "%. There's some love here!");
        } else {
            alert(name1 + " and " + name2 + "'s love score is " + loveScore + "%. Oil and water!");
        }
    </script>

</body>
</html>
